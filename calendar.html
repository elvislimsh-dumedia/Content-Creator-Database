<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DU Creatives — Meeting Calendar</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f7f8fa; min-height: 100vh; }
        nav {
            background: white; border-bottom: 1px solid #f0f0f0; padding: 0 1.5rem;
            height: 60px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 8px rgba(0,0,0,0.06);
        }
        .nav-left { display: flex; align-items: center; gap: 0.75rem; }
        .nav-logo { height: 32px; width: auto; }
        .nav-title { font-weight: 700; font-size: 1rem; color: #1a1a1a; }
        .nav-right { display: flex; align-items: center; gap: 0.75rem; }
        .nav-link {
            display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem;
            border: 1.5px solid #e5e5e5; border-radius: 8px; background: white;
            font-size: 0.875rem; color: #555; text-decoration: none; transition: 0.2s;
        }
        .nav-link:hover { border-color: #ec4899; color: #ec4899; }
        .user-chip { padding: 0.4rem 0.9rem; background: #fdf4ff; border-radius: 20px; font-size: 0.82rem; font-weight: 600; color: #a855f7; }
        .btn-logout { padding: 0.45rem 1rem; border: 1.5px solid #f0f0f0; border-radius: 8px; background: white; font-size: 0.82rem; color: #888; cursor: pointer; font-family: inherit; transition: 0.2s; }
        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }

        .page { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }

        /* Calendar header */
        .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
        .cal-month { font-size: 1.5rem; font-weight: 800; color: #1a1a1a; }
        .cal-nav { display: flex; align-items: center; gap: 0.5rem; }
        .cal-nav-btn {
            width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #e5e5e5;
            background: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #555; transition: 0.2s;
        }
        .cal-nav-btn:hover { border-color: #ec4899; color: #ec4899; }
        .btn-today {
            padding: 0.45rem 1rem; border: 1.5px solid #e5e5e5; border-radius: 8px;
            background: white; font-size: 0.82rem; font-weight: 600; color: #555; cursor: pointer; font-family: inherit; transition: 0.2s;
        }
        .btn-today:hover { border-color: #ec4899; color: #ec4899; }

        /* Grid */
        .cal-grid { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }
        .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid #f0f0f0; }
        .cal-weekday { padding: 0.75rem 0; text-align: center; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #bbb; }
        .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); }
        .cal-day {
            min-height: 110px; padding: 0.5rem; border-right: 1px solid #f5f5f5; border-bottom: 1px solid #f5f5f5;
            position: relative; vertical-align: top;
        }
        .cal-day:nth-child(7n) { border-right: none; }
        .cal-day.other-month { background: #fafafa; }
        .cal-day.today .day-num {
            background: linear-gradient(135deg, #f97316, #ec4899); color: white;
        }
        .day-num {
            width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: 600; color: #1a1a1a; margin-bottom: 0.35rem;
        }
        .cal-day.other-month .day-num { color: #ccc; }
        .events { display: flex; flex-direction: column; gap: 3px; }
        .event {
            padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 0.72rem; font-weight: 600;
            cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: opacity 0.15s; line-height: 1.3;
        }
        .event:hover { opacity: 0.85; }
        .event.approved { background: #dbeafe; color: #1d4ed8; }
        .event.confirmed { background: #dcfce7; color: #15803d; }
        .event .event-time { font-weight: 400; opacity: 0.8; }

        /* Detail popup */
        .popup-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
            display: flex; align-items: center; justify-content: center; padding: 1rem;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .popup-overlay.show { opacity: 1; pointer-events: all; }
        .popup {
            background: white; border-radius: 20px; padding: 2rem; max-width: 420px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); transform: scale(0.95); transition: transform 0.2s;
        }
        .popup-overlay.show .popup { transform: scale(1); }
        .popup-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; }
        .popup-title { font-size: 1.1rem; font-weight: 800; color: #1a1a1a; }
        .popup-close { background: none; border: none; cursor: pointer; color: #bbb; padding: 2px; }
        .popup-close:hover { color: #888; }
        .popup-row { display: flex; gap: 0.6rem; margin-bottom: 0.75rem; align-items: flex-start; }
        .popup-icon { width: 32px; height: 32px; background: #f7f8fa; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #888; }
        .popup-info { flex: 1; }
        .popup-info .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #bbb; margin-bottom: 0.1rem; }
        .popup-info .value { font-size: 0.9rem; color: #1a1a1a; font-weight: 500; }
        .popup-badge { display: inline-block; padding: 0.3rem 0.75rem; border-radius: 20px; font-size: 0.78rem; font-weight: 700; margin-top: 0.5rem; }
        .popup-badge.approved { background: #dbeafe; color: #1d4ed8; }
        .popup-badge.confirmed { background: #dcfce7; color: #15803d; }

        .legend { display: flex; gap: 1rem; margin-bottom: 1.25rem; }
        .legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: #888; }
        .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
        .legend-dot.approved { background: #dbeafe; border: 1.5px solid #93c5fd; }
        .legend-dot.confirmed { background: #dcfce7; border: 1.5px solid #86efac; }

        .loading { padding: 4rem; text-align: center; color: #bbb; }
        .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #f0f0f0; border-top-color: #ec4899; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            .cal-day { min-height: 70px; padding: 0.3rem; }
            .event { font-size: 0.65rem; padding: 0.2rem 0.35rem; }
            .cal-month { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <img src="logo.png" alt="DU Creatives" class="nav-logo">
            <span class="nav-title">Meeting Calendar</span>
        </div>
        <div class="nav-right">
            <a href="bookings.html" class="nav-link">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                Dashboard
            </a>
            <div class="user-chip" id="userChip"></div>
            <button class="btn-logout" id="logoutBtn">Log out</button>
        </div>
    </nav>

    <div class="page">
        <div class="cal-header">
            <div class="cal-month" id="calMonth"></div>
            <div class="cal-nav">
                <button class="btn-today" id="btnToday">Today</button>
                <button class="cal-nav-btn" id="btnPrev">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <button class="cal-nav-btn" id="btnNext">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>
        </div>
        <div class="legend">
            <div class="legend-item"><div class="legend-dot approved"></div>Approved</div>
            <div class="legend-item"><div class="legend-dot confirmed"></div>Confirmed</div>
        </div>
        <div class="cal-grid" id="calGrid">
            <div class="loading"><span class="spinner"></span>Loading…</div>
        </div>
    </div>

    <!-- Detail popup -->
    <div class="popup-overlay" id="popupOverlay" onclick="closePopup(event)">
        <div class="popup" id="popup">
            <div class="popup-header">
                <div class="popup-title" id="popupTitle"></div>
                <button class="popup-close" onclick="document.getElementById('popupOverlay').classList.remove('show')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div id="popupBody"></div>
        </div>
    </div>

    <script>
        let currentYear, currentMonth;
        let bookings = [];

        const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        function fmt12(dt) {
            const d = new Date(dt);
            return d.toLocaleString('en-MY', { hour: '2-digit', minute: '2-digit', hour12: true });
        }
        function fmtFull(dt) {
            const d = new Date(dt);
            return d.toLocaleString('en-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function renderCalendar() {
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const today = new Date();

            document.getElementById('calMonth').textContent = `${MONTHS[currentMonth]} ${currentYear}`;

            // Build day map from bookings
            const byDay = {};
            bookings.forEach(b => {
                if (!b.confirmed_slot) return;
                const d = new Date(b.confirmed_slot);
                const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                if (!byDay[key]) byDay[key] = [];
                byDay[key].push(b);
            });

            let html = '<div class="cal-weekdays">' + DAYS.map(d => `<div class="cal-weekday">${d}</div>`).join('') + '</div>';
            html += '<div class="cal-days">';

            const startDow = firstDay.getDay();
            const totalCells = Math.ceil((startDow + lastDay.getDate()) / 7) * 7;

            for (let i = 0; i < totalCells; i++) {
                const dayOffset = i - startDow;
                const date = new Date(currentYear, currentMonth, 1 + dayOffset);
                const isOther = date.getMonth() !== currentMonth;
                const isToday = date.toDateString() === today.toDateString();
                const key = `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
                const dayBookings = byDay[key] || [];

                let classes = 'cal-day';
                if (isOther) classes += ' other-month';
                if (isToday) classes += ' today';

                const eventsHtml = dayBookings.map(b => {
                    const time = fmt12(b.confirmed_slot);
                    const client = b.client_name.length > 14 ? b.client_name.slice(0, 13) + '…' : b.client_name;
                    return `<div class="event ${b.status}" onclick="showBooking(${b.id})" title="${b.client_name}">
                        ${client} <span class="event-time">${time}</span>
                    </div>`;
                }).join('');

                html += `<div class="${classes}">
                    <div class="day-num">${date.getDate()}</div>
                    <div class="events">${eventsHtml}</div>
                </div>`;
            }

            html += '</div>';
            document.getElementById('calGrid').innerHTML = html;
        }

        function showBooking(id) {
            const b = bookings.find(x => x.id === id);
            if (!b) return;
            document.getElementById('popupTitle').textContent = b.client_name;
            document.getElementById('popupBody').innerHTML = `
                <div class="popup-row">
                    <div class="popup-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
                    <div class="popup-info"><div class="label">Date & Time</div><div class="value">${fmtFull(b.confirmed_slot)}</div></div>
                </div>
                ${b.client_company ? `<div class="popup-row">
                    <div class="popup-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></div>
                    <div class="popup-info"><div class="label">Company</div><div class="value">${b.client_company}</div></div>
                </div>` : ''}
                <div class="popup-row">
                    <div class="popup-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
                    <div class="popup-info"><div class="label">Requested by</div><div class="value">${b.sales_name}</div></div>
                </div>
                ${b.meeting_purpose ? `<div class="popup-row">
                    <div class="popup-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                    <div class="popup-info"><div class="label">Purpose</div><div class="value">${b.meeting_purpose}</div></div>
                </div>` : ''}
                ${b.admin_notes ? `<div class="popup-row">
                    <div class="popup-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
                    <div class="popup-info"><div class="label">Notes</div><div class="value">${b.admin_notes}</div></div>
                </div>` : ''}
                <span class="popup-badge ${b.status}">${b.status === 'approved' ? 'Approved' : 'Confirmed'}</span>
            `;
            document.getElementById('popupOverlay').classList.add('show');
        }

        function closePopup(e) {
            if (e.target === document.getElementById('popupOverlay')) {
                document.getElementById('popupOverlay').classList.remove('show');
            }
        }

        async function loadBookings() {
            const { data } = await supabaseClient.from('bookings').select('*').in('status', ['approved', 'confirmed']);
            bookings = data || [];
            renderCalendar();
        }

        document.getElementById('btnPrev').addEventListener('click', () => {
            currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        });
        document.getElementById('btnNext').addEventListener('click', () => {
            currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        });
        document.getElementById('btnToday').addEventListener('click', () => {
            const t = new Date(); currentYear = t.getFullYear(); currentMonth = t.getMonth();
            renderCalendar();
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            const s = localStorage.getItem('duc_booking_session');
            if (s) {
                try { const { token } = JSON.parse(s); supabaseClient.from('booking_sessions').delete().eq('session_token', token); } catch (_) {}
            }
            localStorage.removeItem('duc_booking_session');
            window.location.href = 'book-login.html';
        });

        (async () => {
            const s = localStorage.getItem('duc_booking_session');
            if (!s) { window.location.href = 'book-login.html'; return; }
            const { token } = JSON.parse(s);
            const { data } = await supabaseClient.rpc('check_booking_session', { tok: token });
            if (!data?.valid) { localStorage.removeItem('duc_booking_session'); window.location.href = 'book-login.html'; return; }

            document.getElementById('userChip').textContent = `${data.role === 'admin' ? '👑 ' : ''}${data.name}`;

            const t = new Date();
            currentYear = t.getFullYear();
            currentMonth = t.getMonth();

            await loadBookings();
        })();
    </script>
</body>
</html>
