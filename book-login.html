<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DU Creatives — Booking Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #f97316 0%, #ec4899 40%, #a855f7 80%, #7c3aed 100%);
            position: relative; overflow: hidden;
        }
        body::before, body::after { content: ''; position: absolute; border-radius: 50%; opacity: 0.15; }
        body::before { width: 500px; height: 500px; background: #fff; top: -150px; left: -100px; }
        body::after { width: 400px; height: 400px; background: #fff; bottom: -100px; right: -80px; }
        .dots {
            position: absolute; width: 100%; height: 100%; pointer-events: none;
            background-image: radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .card {
            background: white; border-radius: 20px; padding: 3rem 2.5rem;
            width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            position: relative; z-index: 1;
        }
        .logo { width: 160px; height: auto; margin: 0 auto 1.5rem; display: block; }
        h2 { font-size: 1.4rem; font-weight: 700; color: #1a1a1a; text-align: center; margin-bottom: 0.3rem; }
        .sub { color: #999; font-size: 0.875rem; text-align: center; margin-bottom: 1.75rem; }
        .badge {
            display: inline-block; background: linear-gradient(135deg, #f97316, #ec4899);
            color: white; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem;
            border-radius: 20px; margin-bottom: 1.5rem; text-align: center; width: 100%;
        }
        .section-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #aaa; margin-bottom: 0.6rem; }
        .radio-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.1rem; }
        .radio-option {
            display: flex; align-items: center; gap: 0.85rem;
            padding: 0.85rem 1rem; border: 1.5px solid #e5e5e5; border-radius: 12px;
            cursor: pointer; transition: border-color 0.2s, background 0.2s; user-select: none;
        }
        .radio-option:hover { border-color: #ec4899; background: #fff5fb; }
        .radio-option.selected { border-color: #ec4899; background: #fff5fb; }
        .radio-dot {
            width: 20px; height: 20px; border-radius: 50%; border: 2px solid #ddd;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color 0.2s;
        }
        .radio-option.selected .radio-dot { border-color: #ec4899; }
        .radio-dot-inner {
            width: 10px; height: 10px; border-radius: 50%;
            background: linear-gradient(135deg, #f97316, #ec4899); opacity: 0; transform: scale(0); transition: opacity 0.15s, transform 0.15s;
        }
        .radio-option.selected .radio-dot-inner { opacity: 1; transform: scale(1); }
        .radio-label { font-size: 0.95rem; font-weight: 600; color: #1a1a1a; }
        .field { position: relative; margin-bottom: 0.85rem; }
        .field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #ccc; pointer-events: none; }
        .field input {
            width: 100%; padding: 0.85rem 2.8rem; border: 1.5px solid #e5e5e5;
            border-radius: 12px; font-size: 1rem; transition: border-color 0.2s; font-family: inherit;
            background: white; color: #1a1a1a;
        }
        .field input:focus { outline: none; border-color: #ec4899; }
        .toggle-pw { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #bbb; padding: 2px; }
        .toggle-pw:hover { color: #888; }
        .login-msg { font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }
        .login-msg.show { display: block; }
        .login-msg.error { color: #ef4444; }
        .btn {
            width: 100%; padding: 0.9rem; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700; color: white; cursor: pointer;
            background: linear-gradient(90deg, #f97316, #ec4899, #a855f7);
            background-size: 200% auto; transition: background-position 0.4s, box-shadow 0.2s; font-family: inherit;
        }
        .btn:hover { background-position: right center; box-shadow: 0 4px 20px rgba(236,72,153,0.35); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="dots"></div>
    <div class="card">
        <img src="logo.png" alt="DU Creatives" class="logo">
        <div class="badge">BOOKING PORTAL</div>
        <h2>Schedule a Client Meeting</h2>
        <p class="sub">Select your team and enter your password</p>
        <form id="loginForm">
            <div class="section-label">I am from</div>
            <div class="radio-group">
                <div class="radio-option" data-value="DU Creatives" onclick="selectTeam(this)">
                    <div class="radio-dot"><div class="radio-dot-inner"></div></div>
                    <span class="radio-label">DU Creatives</span>
                </div>
                <div class="radio-option" data-value="Enspire" onclick="selectTeam(this)">
                    <div class="radio-dot"><div class="radio-dot-inner"></div></div>
                    <span class="radio-label">Enspire</span>
                </div>
            </div>
            <div class="field">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="passwordInput" placeholder="Password" required>
                <button type="button" class="toggle-pw" id="togglePw">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <p id="loginMsg" class="login-msg"></p>
            <button type="submit" class="btn" id="loginBtn">Access Booking Portal</button>
        </form>
    </div>
    <script>
        let selectedName = '';

        function selectTeam(el) {
            document.querySelectorAll('.radio-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            selectedName = el.dataset.value;
        }

        (async () => {
            const s = localStorage.getItem('duc_booking_session');
            if (s) {
                try {
                    const { token } = JSON.parse(s);
                    const { data } = await supabaseClient.rpc('check_booking_session', { tok: token });
                    if (data?.valid) { window.location.href = 'bookings.html'; return; }
                } catch (_) {}
                localStorage.removeItem('duc_booking_session');
            }
        })();

        const pwInput = document.getElementById('passwordInput');
        document.getElementById('togglePw').addEventListener('click', () => {
            pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
        });

        document.getElementById('loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('loginMsg');
            const password = pwInput.value;

            btn.disabled = true; btn.textContent = 'Verifying...';
            msg.className = 'login-msg';

            try {
                const { data, error } = await supabaseClient.rpc('verify_booking_login', {
                    pwd: password, uname: selectedName
                });
                if (error || !data) throw new Error(error?.message || 'Login failed');
                if (data.error) {
                    msg.textContent = data.error;
                    msg.className = 'login-msg show error';
                } else {
                    localStorage.setItem('duc_booking_session', JSON.stringify({
                        token: data.token, role: data.role, name: data.name
                    }));
                    window.location.href = 'bookings.html';
                }
            } catch (err) {
                msg.textContent = err.message || 'Connection error. Please try again.';
                msg.className = 'login-msg show error';
            } finally {
                btn.disabled = false; btn.textContent = 'Access Booking Portal';
            }
        });
    </script>
</body>
</html>
