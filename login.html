<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DU Creatives — Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f97316 0%, #ec4899 40%, #a855f7 80%, #7c3aed 100%);
            position: relative;
            overflow: hidden;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
        }

        body::before { width: 500px; height: 500px; background: #fff; top: -150px; left: -100px; }
        body::after { width: 400px; height: 400px; background: #fff; bottom: -100px; right: -80px; }

        .dots {
            position: absolute;
            width: 100%; height: 100%;
            background-image: radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            position: relative;
            z-index: 1;
        }

        .logo-img {
            width: 180px; height: auto;
            margin: 0 auto 1.5rem;
            display: block; object-fit: contain;
        }

        .login-card h2 { font-size: 1.5rem; font-weight: 700; color: #1a1a1a; margin-bottom: 0.4rem; }
        .login-card .sub { color: #999; font-size: 0.9rem; margin-bottom: 1.75rem; }

        .field { position: relative; margin-bottom: 0.75rem; }
        .field .icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #ccc;
        }
        .field input {
            width: 100%;
            padding: 0.85rem 2.8rem;
            border: 1.5px solid #e5e5e5;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .field input:focus { outline: none; border-color: #ec4899; }

        .toggle-pw {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: #bbb; padding: 2px;
        }
        .toggle-pw:hover { color: #888; }

        .name-field { margin-bottom: 0.75rem; }
        .name-field input {
            width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem;
            border: 1.5px solid #e5e5e5; border-radius: 12px; font-size: 1rem;
        }
        .name-field input:focus { outline: none; border-color: #ec4899; }

        .login-msg { font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }
        .login-msg.show { display: block; }
        .login-msg.error { color: #ef4444; }

        .login-btn {
            width: 100%; padding: 0.85rem; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700; color: white; cursor: pointer;
            background: linear-gradient(90deg, #f97316, #ec4899, #a855f7);
            background-size: 200% auto;
            transition: background-position 0.4s, box-shadow 0.2s;
        }
        .login-btn:hover { background-position: right center; box-shadow: 0 4px 20px rgba(236,72,153,0.35); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Waiting state */
        .waiting-state { display: none; }
        .waiting-state.show { display: block; }

        .waiting-spinner {
            width: 48px; height: 48px;
            border: 3px solid #eee; border-top-color: #ec4899;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.25rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .waiting-text { color: #888; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .waiting-name { font-weight: 600; color: #1a1a1a; font-size: 0.95rem; margin-bottom: 1.25rem; }

        .cancel-link {
            color: #ccc; cursor: pointer; text-decoration: underline;
            font-size: 0.82rem; background: none; border: none;
        }
        .cancel-link:hover { color: #888; }

        /* Rejected state */
        .rejected-icon {
            width: 48px; height: 48px;
            background: #fef2f2; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
        }

        .try-again-link {
            color: #ec4899; cursor: pointer; text-decoration: underline;
            font-size: 0.85rem; background: none; border: none; margin-top: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="dots"></div>
    <div class="login-card">
        <img src="logo.png" alt="DU Creatives" class="logo-img">
        <h2>Content Creator Database</h2>

        <!-- Step 1: Password + Name -->
        <div id="loginState">
            <p class="sub">Enter the password to request access</p>
            <form id="loginForm">
                <div class="field name-field">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="nameInput" placeholder="Your name" required>
                </div>
                <div class="field">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <input type="password" id="passwordInput" placeholder="Password" required>
                    <button type="button" class="toggle-pw" id="togglePw">
                        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <p id="loginMsg" class="login-msg"></p>
                <button type="submit" class="login-btn" id="loginBtn">Request Access</button>
            </form>
        </div>

        <!-- Step 2: Waiting for approval -->
        <div id="waitingState" class="waiting-state">
            <div class="waiting-spinner"></div>
            <p class="waiting-text">Waiting for admin approval...</p>
            <p class="waiting-name" id="waitingName"></p>
            <p style="color:#bbb;font-size:0.78rem;margin-bottom:1rem">Your request has been sent. The admin will approve it shortly.</p>
            <button class="cancel-link" id="cancelRequest">Cancel</button>
        </div>

        <!-- Step 3: Rejected -->
        <div id="rejectedState" class="waiting-state">
            <div class="rejected-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
            <p style="font-weight:600;color:#1a1a1a;margin-bottom:0.5rem">Access Denied</p>
            <p style="color:#888;font-size:0.85rem">Your request was not approved.</p>
            <button class="try-again-link" id="tryAgain">Try Again</button>
        </div>
    </div>

    <script>
        // Check if already has valid session
        (async () => {
            const token = localStorage.getItem('duc_session');
            if (token) {
                const { data } = await supabaseClient.rpc('check_session', { token });
                if (data && data.length && data[0].is_valid) {
                    window.location.href = '/';
                    return;
                }
                localStorage.removeItem('duc_session');
            }
        })();

        // Toggle password visibility
        const pwInput = document.getElementById('passwordInput');
        document.getElementById('togglePw').addEventListener('click', () => {
            const showing = pwInput.type === 'text';
            pwInput.type = showing ? 'password' : 'text';
        });

        let currentSessionId = null;
        let realtimeChannel = null;

        // Login form submit
        document.getElementById('loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('loginMsg');
            const name = document.getElementById('nameInput').value.trim();
            const password = pwInput.value;

            btn.disabled = true;
            btn.textContent = 'Verifying...';
            msg.classList.remove('show');

            try {
                // Verify password via RPC (password is NOT in frontend code)
                const { data: isValid, error } = await supabaseClient.rpc('verify_access_password', { pwd: password });

                if (error || !isValid) {
                    msg.textContent = 'Incorrect password. Please try again.';
                    msg.className = 'login-msg show error';
                    pwInput.select();
                    btn.disabled = false;
                    btn.textContent = 'Request Access';
                    return;
                }

                // Password correct — create access request
                const sessionToken = crypto.randomUUID();
                const deviceInfo = navigator.userAgent.substring(0, 100);

                const { data: session, error: insertErr } = await supabaseClient
                    .from('access_sessions')
                    .insert([{
                        session_token: sessionToken,
                        requester_name: name || 'Anonymous',
                        device_info: deviceInfo,
                        status: 'pending'
                    }])
                    .select()
                    .single();

                if (insertErr) throw insertErr;

                currentSessionId = session.id;

                // Show waiting state
                document.getElementById('loginState').style.display = 'none';
                document.getElementById('waitingState').classList.add('show');
                document.getElementById('waitingName').textContent = name || 'Anonymous';

                // Subscribe to Realtime for this session's status changes
                realtimeChannel = supabaseClient
                    .channel('session-' + session.id)
                    .on('postgres_changes', {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'access_sessions',
                        filter: 'id=eq.' + session.id
                    }, (payload) => {
                        const newStatus = payload.new.status;
                        if (newStatus === 'approved') {
                            localStorage.setItem('duc_session', sessionToken);
                            localStorage.setItem('duc_user', name || 'Anonymous');
                            window.location.href = '/';
                        } else if (newStatus === 'rejected') {
                            showRejected();
                        }
                    })
                    .subscribe();

                // Also poll every 5s as fallback (in case Realtime has issues)
                startPolling(sessionToken, name);

            } catch (err) {
                msg.textContent = 'Error: ' + err.message;
                msg.className = 'login-msg show error';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Request Access';
            }
        });

        let pollInterval = null;

        function startPolling(token, name) {
            pollInterval = setInterval(async () => {
                const { data } = await supabaseClient.rpc('check_session', { token });
                if (data && data.length) {
                    if (data[0].session_status === 'approved') {
                        clearInterval(pollInterval);
                        localStorage.setItem('duc_session', token);
                        localStorage.setItem('duc_user', name || 'Anonymous');
                        window.location.href = '/';
                    } else if (data[0].session_status === 'rejected') {
                        clearInterval(pollInterval);
                        showRejected();
                    }
                }
            }, 5000);
        }

        function showRejected() {
            document.getElementById('waitingState').classList.remove('show');
            document.getElementById('rejectedState').classList.add('show');
            if (realtimeChannel) {
                supabaseClient.removeChannel(realtimeChannel);
                realtimeChannel = null;
            }
        }

        // Cancel request
        document.getElementById('cancelRequest').addEventListener('click', async () => {
            if (pollInterval) clearInterval(pollInterval);
            if (realtimeChannel) {
                supabaseClient.removeChannel(realtimeChannel);
                realtimeChannel = null;
            }
            if (currentSessionId) {
                await supabaseClient.from('access_sessions').update({ status: 'rejected' }).eq('id', currentSessionId);
            }
            document.getElementById('waitingState').classList.remove('show');
            document.getElementById('loginState').style.display = 'block';
        });

        // Try again
        document.getElementById('tryAgain').addEventListener('click', () => {
            document.getElementById('rejectedState').classList.remove('show');
            document.getElementById('loginState').style.display = 'block';
            pwInput.value = '';
        });
    </script>
</body>
</html>
