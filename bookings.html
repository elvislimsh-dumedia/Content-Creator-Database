<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DU Creatives — Booking Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f7f8fa; min-height: 100vh; }
        .hidden { display: none !important; }
        nav {
            background: white; border-bottom: 1px solid #f0f0f0; padding: 0 1.5rem;
            height: 60px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 8px rgba(0,0,0,0.06);
        }
        .nav-left { display: flex; align-items: center; gap: 0.75rem; }
        .nav-logo { height: 32px; width: auto; }
        .nav-title { font-weight: 700; font-size: 1rem; color: #1a1a1a; }
        .nav-right { display: flex; align-items: center; gap: 0.75rem; }
        .user-chip {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.9rem;
            background: #fdf4ff; border-radius: 20px; font-size: 0.82rem; font-weight: 600; color: #a855f7;
        }
        .btn-logout {
            padding: 0.45rem 1rem; border: 1.5px solid #f0f0f0; border-radius: 8px;
            background: white; font-size: 0.82rem; color: #888; cursor: pointer; font-family: inherit; transition: 0.2s;
        }
        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }
        .page { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.75rem; }
        .page-header h1 { font-size: 1.6rem; font-weight: 800; color: #1a1a1a; }
        .btn-new {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.25rem;
            border: none; border-radius: 10px; background: linear-gradient(90deg, #f97316, #ec4899);
            color: white; font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit;
            text-decoration: none; transition: box-shadow 0.2s;
        }
        .btn-new:hover { box-shadow: 0 4px 16px rgba(236,72,153,0.35); }
        .section { margin-bottom: 2rem; }
        .section-title {
            font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
            color: #aaa; margin-bottom: 0.9rem;
        }
        .card {
            background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .booking-row {
            padding: 1.25rem 1.5rem; border-bottom: 1px solid #f7f7f7;
            display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: start;
        }
        .booking-row:last-child { border-bottom: none; }
        .booking-main { min-width: 0; }
        .booking-client { font-weight: 700; font-size: 1rem; color: #1a1a1a; }
        .booking-meta { font-size: 0.82rem; color: #999; margin-top: 0.2rem; }
        .booking-meta span + span::before { content: ' · '; }
        .booking-purpose { font-size: 0.875rem; color: #666; margin-top: 0.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slots-list { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.3rem; }
        .slot-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; }
        .slot-num { width: 20px; height: 20px; background: #f0f0f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: #888; flex-shrink: 0; }
        .slot-num.confirmed { background: linear-gradient(135deg,#22c55e,#16a34a); color: white; }
        .slot-time { color: #555; }
        .confirmed-badge { display: inline-flex; align-items: center; gap: 0.3rem; margin-top: 0.6rem; padding: 0.35rem 0.75rem; background: #dcfce7; border-radius: 20px; font-size: 0.8rem; font-weight: 600; color: #16a34a; }
        .counter-badge { display: inline-flex; align-items: center; gap: 0.3rem; margin-top: 0.6rem; padding: 0.35rem 0.75rem; background: #fef3c7; border-radius: 20px; font-size: 0.8rem; font-weight: 600; color: #d97706; }
        .badge {
            display: inline-block; padding: 0.25rem 0.7rem; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700; white-space: nowrap; align-self: flex-start;
        }
        .badge-pending { background: #fef9c3; color: #a16207; }
        .badge-approved { background: #dcfce7; color: #15803d; }
        .badge-declined { background: #fee2e2; color: #b91c1c; }
        .badge-counter { background: #fef3c7; color: #92400e; }
        .badge-confirmed { background: #dcfce7; color: #15803d; }
        .action-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.85rem; }
        .btn-action {
            padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
            cursor: pointer; font-family: inherit; border: none; transition: 0.15s;
        }
        .btn-approve { background: #dcfce7; color: #15803d; }
        .btn-approve:hover { background: #bbf7d0; }
        .btn-decline { background: #fee2e2; color: #b91c1c; }
        .btn-decline:hover { background: #fecaca; }
        .btn-counter { background: #fef9c3; color: #854d0e; }
        .btn-counter:hover { background: #fef08a; }
        .btn-confirm { background: linear-gradient(90deg,#22c55e,#16a34a); color: white; }
        .btn-confirm:hover { box-shadow: 0 3px 12px rgba(34,197,94,0.35); }
        .slot-select {
            width: 100%; padding: 0.7rem 1rem; border: 1.5px solid #e5e5e5; border-radius: 10px;
            font-size: 0.9rem; font-family: inherit; margin-top: 0.5rem; color: #1a1a1a;
        }
        .slot-select:focus { outline: none; border-color: #ec4899; }
        .counter-input-wrap { margin-top: 0.6rem; }
        .counter-input-wrap label { display: block; font-size: 0.78rem; font-weight: 600; color: #888; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .counter-input {
            padding: 0.7rem 1rem; border: 1.5px solid #e5e5e5; border-radius: 10px;
            font-size: 0.9rem; font-family: inherit; color: #1a1a1a;
        }
        .counter-input:focus { outline: none; border-color: #ec4899; }
        .admin-notes-wrap { margin-top: 0.6rem; }
        .admin-notes-wrap textarea {
            width: 100%; padding: 0.7rem 1rem; border: 1.5px solid #e5e5e5; border-radius: 10px;
            font-size: 0.88rem; font-family: inherit; resize: vertical; min-height: 60px;
        }
        .admin-notes-wrap textarea:focus { outline: none; border-color: #ec4899; }
        .notes-display { margin-top: 0.5rem; font-size: 0.82rem; color: #888; font-style: italic; }
        .empty-state { padding: 3rem 1.5rem; text-align: center; color: #bbb; font-size: 0.9rem; }
        .loading { padding: 3rem 1.5rem; text-align: center; color: #bbb; font-size: 0.9rem; }
        .spinner { display: inline-block; width: 24px; height: 24px; border: 2.5px solid #e5e5e5; border-top-color: #ec4899; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #1a1a1a; color: white; padding: 0.85rem 1.5rem; border-radius: 12px;
            font-size: 0.9rem; font-weight: 500; transition: transform 0.3s ease; z-index: 1000; white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: #22c55e; }
        .toast.error { background: #ef4444; }
        @media (max-width: 600px) { .page { padding: 1.25rem 1rem; } .booking-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <img src="logo.png" alt="DU Creatives" class="nav-logo">
            <span class="nav-title">Booking Dashboard</span>
        </div>
        <div class="nav-right">
            <div class="user-chip" id="userChip"></div>
            <button class="btn-logout" id="logoutBtn">Log out</button>
        </div>
    </nav>
    <div class="page">
        <div class="page-header">
            <h1 id="pageTitle">Dashboard</h1>
            <a href="book.html" class="btn-new hidden" id="newRequestBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Request
            </a>
        </div>

        <!-- ADMIN VIEW -->
        <div id="adminView" class="hidden">
            <div class="section" id="pendingSection">
                <div class="section-title">Pending Approval</div>
                <div class="card" id="pendingList"><div class="loading"><span class="spinner"></span>Loading…</div></div>
            </div>
            <div class="section hidden" id="counterSection">
                <div class="section-title">Awaiting Sales Response (Counter Proposed)</div>
                <div class="card" id="counterList"></div>
            </div>
            <div class="section">
                <div class="section-title">All Bookings</div>
                <div class="card" id="allList"></div>
            </div>
        </div>

        <!-- SALES VIEW -->
        <div id="salesView" class="hidden">
            <div class="section hidden" id="upcomingSection">
                <div class="section-title">Confirmed Meetings</div>
                <div class="card" id="upcomingList"></div>
            </div>
            <div class="section hidden" id="awaitingSection">
                <div class="section-title">Awaiting Your Response</div>
                <div class="card" id="awaitingList"></div>
            </div>
            <div class="section">
                <div class="section-title">All My Requests</div>
                <div class="card" id="myList"><div class="loading"><span class="spinner"></span>Loading…</div></div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        let currentRole = '';
        let currentName = '';
        let allBookings = [];

        function fmt(dt) {
            if (!dt) return '—';
            const d = new Date(dt);
            return d.toLocaleString('en-MY', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function badgeHtml(status) {
            const map = { pending: ['badge-pending','Pending'], approved: ['badge-approved','Approved'], declined: ['badge-declined','Declined'], counter_proposed: ['badge-counter','Counter Proposed'], confirmed: ['badge-confirmed','Confirmed'] };
            const [cls, label] = map[status] || ['badge-pending', status];
            return `<span class="badge ${cls}">${label}</span>`;
        }

        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = `toast show ${type}`;
            setTimeout(() => { t.className = 'toast'; }, 3000);
        }

        async function adminAction(id, action) {
            const updates = { updated_at: new Date().toISOString() };
            if (action === 'approve') {
                const slot = document.getElementById(`slot-select-${id}`)?.value;
                if (!slot) { showToast('Please select a slot to approve.', 'error'); return; }
                updates.status = 'approved';
                updates.confirmed_slot = slot;
                updates.admin_notes = document.getElementById(`notes-${id}`)?.value || '';
            } else if (action === 'decline') {
                updates.status = 'declined';
                updates.admin_notes = document.getElementById(`notes-${id}`)?.value || '';
            } else if (action === 'counter') {
                const cs = document.getElementById(`counter-dt-${id}`)?.value;
                if (!cs) { showToast('Please pick a counter date/time.', 'error'); return; }
                updates.status = 'counter_proposed';
                updates.counter_slot = cs;
                updates.admin_notes = document.getElementById(`notes-${id}`)?.value || '';
            }
            const { error } = await supabaseClient.from('bookings').update(updates).eq('id', id);
            if (error) { showToast(error.message, 'error'); return; }
            showToast('Updated!', 'success');
            await loadBookings();
        }

        async function salesAction(id, action) {
            const updates = { updated_at: new Date().toISOString() };
            if (action === 'confirm_counter') {
                updates.status = 'confirmed';
                const b = allBookings.find(x => x.id === id);
                if (b) updates.confirmed_slot = b.counter_slot;
            } else if (action === 'decline_counter') {
                updates.status = 'declined';
            }
            const { error } = await supabaseClient.from('bookings').update(updates).eq('id', id);
            if (error) { showToast(error.message, 'error'); return; }
            showToast('Updated!', 'success');
            await loadBookings();
        }

        function renderAdminBooking(b, showActions) {
            const slots = [b.slot1, b.slot2, b.slot3].filter(Boolean);
            let slotsHtml = `<div class="slots-list">${slots.map((s,i) => {
                const isConf = b.confirmed_slot === s;
                return `<div class="slot-row"><div class="slot-num ${isConf?'confirmed':''}">${i+1}</div><span class="slot-time">${fmt(s)}</span></div>`;
            }).join('')}</div>`;
            let extraHtml = '';
            if (b.confirmed_slot && b.status !== 'counter_proposed') {
                extraHtml += `<div class="confirmed-badge"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Confirmed: ${fmt(b.confirmed_slot)}</div>`;
            }
            if (b.counter_slot) {
                extraHtml += `<div class="counter-badge">Counter suggested: ${fmt(b.counter_slot)}</div>`;
            }
            if (b.admin_notes) {
                extraHtml += `<div class="notes-display">Notes: ${b.admin_notes}</div>`;
            }
            let actionsHtml = '';
            if (showActions && b.status === 'pending') {
                actionsHtml = `
                    <select class="slot-select" id="slot-select-${b.id}">
                        <option value="">— Select a slot to approve —</option>
                        ${slots.map(s => `<option value="${s}">${fmt(s)}</option>`).join('')}
                    </select>
                    <div class="counter-input-wrap">
                        <label>Or suggest a counter date/time</label>
                        <input type="datetime-local" class="counter-input" id="counter-dt-${b.id}">
                    </div>
                    <div class="admin-notes-wrap">
                        <textarea id="notes-${b.id}" placeholder="Notes to sales team (optional)…"></textarea>
                    </div>
                    <div class="action-row">
                        <button class="btn-action btn-approve" onclick="adminAction(${b.id},'approve')">✓ Approve Selected Slot</button>
                        <button class="btn-action btn-counter" onclick="adminAction(${b.id},'counter')">↔ Suggest Counter</button>
                        <button class="btn-action btn-decline" onclick="adminAction(${b.id},'decline')">✕ Decline</button>
                    </div>`;
            }
            return `<div class="booking-row">
                <div class="booking-main">
                    <div class="booking-client">${b.client_name}${b.client_company ? ` <span style="font-weight:400;color:#999">· ${b.client_company}</span>` : ''}</div>
                    <div class="booking-meta"><span>By ${b.sales_name}</span><span>${new Date(b.created_at).toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'})}</span></div>
                    ${b.meeting_purpose ? `<div class="booking-purpose">${b.meeting_purpose}</div>` : ''}
                    ${slotsHtml}${extraHtml}${actionsHtml}
                </div>
                ${badgeHtml(b.status)}
            </div>`;
        }

        function renderSalesBooking(b, showCounterActions) {
            const slots = [b.slot1, b.slot2, b.slot3].filter(Boolean);
            let slotsHtml = `<div class="slots-list">${slots.map((s,i) => {
                const isConf = b.confirmed_slot === s;
                return `<div class="slot-row"><div class="slot-num ${isConf?'confirmed':''}">${i+1}</div><span class="slot-time">${fmt(s)}</span></div>`;
            }).join('')}</div>`;
            let extraHtml = '';
            if (b.confirmed_slot) {
                extraHtml += `<div class="confirmed-badge"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Meeting confirmed: ${fmt(b.confirmed_slot)}</div>`;
            }
            if (b.counter_slot) {
                extraHtml += `<div class="counter-badge">Admin suggests: ${fmt(b.counter_slot)}</div>`;
            }
            if (b.admin_notes) {
                extraHtml += `<div class="notes-display">Admin note: ${b.admin_notes}</div>`;
            }
            let actionsHtml = '';
            if (showCounterActions && b.status === 'counter_proposed') {
                actionsHtml = `<div class="action-row">
                    <button class="btn-action btn-confirm" onclick="salesAction(${b.id},'confirm_counter')">✓ Accept Counter Time</button>
                    <button class="btn-action btn-decline" onclick="salesAction(${b.id},'decline_counter')">✕ Decline</button>
                </div>`;
            }
            return `<div class="booking-row">
                <div class="booking-main">
                    <div class="booking-client">${b.client_name}${b.client_company ? ` <span style="font-weight:400;color:#999">· ${b.client_company}</span>` : ''}</div>
                    <div class="booking-meta"><span>${new Date(b.created_at).toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'})}</span></div>
                    ${b.meeting_purpose ? `<div class="booking-purpose">${b.meeting_purpose}</div>` : ''}
                    ${slotsHtml}${extraHtml}${actionsHtml}
                </div>
                ${badgeHtml(b.status)}
            </div>`;
        }

        async function loadBookings() {
            const { data, error } = await supabaseClient.from('bookings').select('*').order('created_at', { ascending: false });
            if (error) { showToast('Failed to load bookings.', 'error'); return; }
            allBookings = data || [];

            if (currentRole === 'admin') {
                const pending = allBookings.filter(b => b.status === 'pending');
                const counter = allBookings.filter(b => b.status === 'counter_proposed');

                document.getElementById('pendingList').innerHTML = pending.length
                    ? pending.map(b => renderAdminBooking(b, true)).join('')
                    : '<div class="empty-state">No pending requests</div>';
                document.getElementById('counterList').innerHTML = counter.length
                    ? counter.map(b => renderAdminBooking(b, false)).join('')
                    : '<div class="empty-state">None awaiting sales response</div>';
                document.getElementById('counterSection').classList.toggle('hidden', counter.length === 0);
                document.getElementById('allList').innerHTML = allBookings.length
                    ? allBookings.map(b => renderAdminBooking(b, false)).join('')
                    : '<div class="empty-state">No bookings yet</div>';
            } else {
                const mine = allBookings.filter(b => b.sales_name === currentName);
                const upcoming = mine.filter(b => ['approved','confirmed'].includes(b.status));
                const awaiting = mine.filter(b => b.status === 'counter_proposed');

                document.getElementById('upcomingList').innerHTML = upcoming.length
                    ? upcoming.map(b => renderSalesBooking(b, false)).join('')
                    : '<div class="empty-state">No confirmed meetings yet</div>';
                document.getElementById('upcomingSection').classList.toggle('hidden', upcoming.length === 0);
                document.getElementById('awaitingList').innerHTML = awaiting.length
                    ? awaiting.map(b => renderSalesBooking(b, true)).join('')
                    : '<div class="empty-state">Nothing awaiting response</div>';
                document.getElementById('awaitingSection').classList.toggle('hidden', awaiting.length === 0);
                document.getElementById('myList').innerHTML = mine.length
                    ? mine.map(b => renderSalesBooking(b, false)).join('')
                    : '<div class="empty-state">You haven\'t submitted any requests yet</div>';
            }
        }

        (async () => {
            const s = localStorage.getItem('duc_booking_session');
            if (!s) { window.location.href = 'book-login.html'; return; }
            const { token } = JSON.parse(s);
            const { data } = await supabaseClient.rpc('check_booking_session', { tok: token });
            if (!data?.valid) { localStorage.removeItem('duc_booking_session'); window.location.href = 'book-login.html'; return; }

            currentRole = data.role;
            currentName = data.name;
            document.getElementById('userChip').textContent = `${currentRole === 'admin' ? '👑 ' : ''}${currentName}`;
            document.getElementById('pageTitle').textContent = currentRole === 'admin' ? 'Admin Dashboard' : 'My Bookings';

            if (currentRole === 'admin') {
                document.getElementById('adminView').classList.remove('hidden');
            } else {
                document.getElementById('salesView').classList.remove('hidden');
                document.getElementById('newRequestBtn').classList.remove('hidden');
            }

            await loadBookings();
        })();

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            const s = localStorage.getItem('duc_booking_session');
            if (s) {
                const { token } = JSON.parse(s);
                await supabaseClient.from('booking_sessions').delete().eq('session_token', token).catch(() => {});
            }
            localStorage.removeItem('duc_booking_session');
            window.location.href = 'book-login.html';
        });
    </script>
</body>
</html>
