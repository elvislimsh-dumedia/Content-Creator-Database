services:
  - type: web
    name: influencer-catalogue
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATA_DIR
        value: /data
    disk:
      name: catalogue-data
      mountPath: /data
      sizeGB: 1
